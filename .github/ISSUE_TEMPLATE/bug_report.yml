name: Bug report
description: Something is broken or behaves unexpectedly
title: 'fix: '
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, tokens or `.env` contents.
        Security problems should go to bayazidsiam5678@gmail.com instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including any error message or toast text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as demo@uispark.test
        2. Open /generate, enter "laundry service website"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / routes
        - Generator (template engine)
        - Generator (AI provider)
        - Gallery / explore
        - Uploads and moderation
        - Auth and accounts
        - Admin dashboard
        - Frontend build / tooling
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, PHP and Node versions, database, and whether a local model or Claude is configured.
      placeholder: Windows 11, PHP 8.5.8, Node 24, MySQL 8, LOCAL_AI_BASE_URL set
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the smallest useful excerpt from `backend/storage/logs/laravel.log`.
      render: shell
    validations:
      required: false
